name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting, ADR numbering, and scripts
        run: |
          make fmt-check
          make check-adr
          REQUIRE_SHELLCHECK=1 make check-scripts

      - name: Install and run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          make lint

      - name: Run unit tests
        run: make test

      - name: Build cmd binaries
        run: make build

  integration:
    name: Integration Tests (PG + Kafka + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FERRY_TEST_PG_DSN: postgres://ferry:ferry@localhost:5432/ferry?sslmode=disable
      FERRY_TEST_REDIS_ADDR: localhost:6379
      FERRY_TEST_REDIS_UNIT_DB: "14"
      FERRY_TEST_REDIS_DB: "15"
      FERRY_TEST_KAFKA_BROKERS: localhost:9092
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Postgres, Kafka, and Redis
        run: docker compose -f deploy/docker-compose.yml up -d --wait postgres kafka redis

      - name: Run integration tests
        run: make test-integration

      - name: Run Milestone 1 black-box verification
        run: timeout 120 env SKIP_TESTS=1 make verify-m1

      - name: Tear down services
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
